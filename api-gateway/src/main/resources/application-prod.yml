# Production profile.
# Secrets are intentionally declared without defaults: an unset variable fails placeholder
# resolution at startup rather than silently falling back to a known dev value.
spring:
  cloud:
    gateway:
      discovery:
        locator:
          # Disabled: the locator would expose /<service-id>/** routes that bypass the
          # explicit route table and reach services' permitAll() paths directly.
          enabled: false

jwt:
  secret: ${JWT_SECRET}

gateway:
  internal:
    secret: ${GATEWAY_INTERNAL_SECRET}

# Allowed browser origins for CORS. Comma-separated, no wildcard.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    '[com.stillfresh.app]': INFO
    '[org.springframework.cloud.gateway]': WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
