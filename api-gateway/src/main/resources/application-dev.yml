# Local development profile (docker-compose on a workstation).
# Reproduces the behaviour the stack had before profiles were introduced.
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

jwt:
  secret: ${JWT_SECRET:}

gateway:
  internal:
    secret: ${GATEWAY_INTERNAL_SECRET:stillfresh-gw-dev-secret-change-in-prod}

cors:
  allowed-origins: http://localhost:5173,http://localhost:8080,http://localhost:5174

logging:
  level:
    root: INFO
