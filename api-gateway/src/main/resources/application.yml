server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive
  application:
    name: api-gateway
  cache:
    type: redis
  data:
    redis:
      host: redis
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
      timeout: 60000

  cloud:
    gateway:
      # discovery.locator is profile-specific: enabling it exposes /<service-id>/** routes
      # that bypass the explicit route table below, so it is off in prod.
      routes:
        - id: authorization-service
          uri: lb://authorization-service
          predicates:
            - Path=/auth/**
        - id: payment-service-admin-mor
          uri: lb://payment-service
          predicates:
            - Path=/admin/mor/**
        - id: payment-service-admin-platform
          uri: lb://payment-service
          predicates:
            - Path=/admin/platform/**
        - id: authorization-service-admin
          uri: lb://authorization-service
          predicates:
            - Path=/admin/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        # Specific route for place-order endpoint (must come before general /orders/** route)
        - id: user-service-place-order
          uri: lb://user-service
          predicates:
            - Path=/orders/place-order
            - Method=POST
        - id: vendor-service
          uri: lb://vendor-service
          predicates:
            - Path=/vendors/**
        - id: vendor-service-images
          uri: lb://vendor-service
          predicates:
            - Path=/images/**
        - id: offer-service
          uri: lb://offer-service
          predicates:
            - Path=/offers/**
        # General order-service route (matches after specific routes)
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payment/**
        - id: payment-service-ledger
          uri: lb://payment-service
          predicates:
            - Path=/ledger/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      '[auto.create.topics.enable]': true
    consumer:
      group-id: api-gateway-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.stillfresh.app.sharedentities,com.stillfresh.app.sharedentities.dto,com.stillfresh.app.sharedentities.enums,com.stillfresh.app.sharedentities.offer.events,com.stillfresh.app.sharedentities.order.events,com.stillfresh.app.sharedentities.payment.events,com.stillfresh.app.sharedentities.shared.events,com.stillfresh.app.sharedentities.user.events,com.stillfresh.app.sharedentities.vendor.events"
    listener:
      missing-topics-fatal: false

gateway:
  jwt:
    # Feature flag to control rollout of local JWT validation at the gateway.
    # When set to false, the gateway will skip local JWT validation and rely on downstream services.
    local-validation-enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka

# jwt.secret and gateway.internal.secret are profile-specific: prod requires them from the
# environment with no fallback so a missing value fails startup instead of opening the trust boundary.

authorization:
  topic:
    name: token-validation-request  # Topic for publishing validation requests
    response: token-validation-response  # Topic for receiving validation responses
