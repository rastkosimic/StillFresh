services:
  # Kafka Broker (using KRaft mode - no Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - stillfresh_network

  # PostgreSQL for user-service
  user-postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: stillfresh_userdb
      POSTGRES_USER: stillfreshuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_USER}
    ports:
      - "5432:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql
      - ./init-user.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stillfresh_network

  # PostgreSQL for vendor-service
  vendor-postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: stillfresh_vendordb
      POSTGRES_USER: stillfreshvendor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_VENDOR}
    ports:
      - "5433:5432"
    volumes:
      - vendor_postgres_data:/var/lib/postgresql
      - ./init-vendor.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stillfresh_network

  # PostgreSQL for authorization-service
  auth-postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: stillfresh_authdb
      POSTGRES_USER: stillfreshauth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_AUTH}
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql
      - ./init-auth.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stillfresh_network

  # PostgreSQL for offer-service
  offer-postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: stillfresh_offerdb
      POSTGRES_USER: stillfreshoffers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_OFFERS}
    ports:
      - "5435:5432"
    volumes:
      - offer_postgres_data:/var/lib/postgresql
      - ./init-offer.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stillfresh_network

  # PostgreSQL for order-service
  order-postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: stillfresh_orderdb
      POSTGRES_USER: stillfreshorders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ORDERS}
    ports:
      - "5436:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql
      - ./init-order.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stillfresh_network

  # PostgreSQL for payment-service
  payment-postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: stillfresh_paymentdb
      POSTGRES_USER: stillfreshpayments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PAYMENTS}
    ports:
      - "5437:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql
      - ./init-payment.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stillfresh_network

  # PostgreSQL for notification-service
  notification-postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: stillfresh_notificationdb
      POSTGRES_USER: stillfreshnotification
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_NOTIFICATION}
    ports:
      - "5438:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql
      - ./init-notification.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stillfresh_network

  # Redis for caching and token blacklisting
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stillfresh_network

  # Eureka service discovery
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - user-postgres
      - vendor-postgres
      - auth-postgres
    networks:
      - stillfresh_network

  # API Gateway
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - authorization-service
      - user-service
      - vendor-service
      - offer-service
      - order-service
      - payment-service
      - notification-service
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stillfresh_network

  # User Service
  user-service:
    build: ./user-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - user-postgres
      - redis
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - POSTGRES_PASSWORD_USER=${POSTGRES_PASSWORD_USER}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL:-}
      - MAILGUN_BASE_URL=${MAILGUN_BASE_URL:-https://api.mailgun.net/v3}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stillfresh_network

  # Vendor Service
  vendor-service:
    build: ./vendor-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - vendor-postgres
      - redis
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - POSTGRES_PASSWORD_VENDOR=${POSTGRES_PASSWORD_VENDOR}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL:-}
      - MAILGUN_BASE_URL=${MAILGUN_BASE_URL:-https://api.mailgun.net/v3}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - vendor_uploads:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stillfresh_network

  # Authorization Service
  authorization-service:
    build: ./authorization-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - auth-postgres
      - redis
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - POSTGRES_PASSWORD_AUTH=${POSTGRES_PASSWORD_AUTH}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL:-}
      - MAILGUN_BASE_URL=${MAILGUN_BASE_URL:-https://api.mailgun.net/v3}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stillfresh_network

  # Offer Service
  offer-service:
    build: ./offer-service
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - offer-postgres
      - redis
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - POSTGRES_PASSWORD_OFFERS=${POSTGRES_PASSWORD_OFFERS}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stillfresh_network

  # Order Service
  order-service:
    build: ./order-service
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - order-postgres
      - redis
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - POSTGRES_PASSWORD_ORDERS=${POSTGRES_PASSWORD_ORDERS}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stillfresh_network

  # Payment Service (not published on the host — reach via api-gateway :8080 only)
  payment-service:
    build: ./payment-service
    expose:
      - "8086"
    depends_on:
      - eureka-server
      - payment-postgres
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - POSTGRES_PASSWORD_PAYMENTS=${POSTGRES_PASSWORD_PAYMENTS}
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - PAYOUT_SCHEDULE_CRON=${PAYOUT_SCHEDULE_CRON:-0 0 2 * * *}
      - PAYOUT_DEFAULT_CURRENCY=${PAYOUT_DEFAULT_CURRENCY:-RSD}
      - PLATFORM_IBAN=${PLATFORM_IBAN}
      - PLATFORM_BANK_NAME=${PLATFORM_BANK_NAME}
      - PLATFORM_ACCOUNT_HOLDER=${PLATFORM_ACCOUNT_HOLDER}
      - BANK_TRANSFER_EXPIRY_HOURS=${BANK_TRANSFER_EXPIRY_HOURS:-24}
      - PAYOUT_MAX_BATCH_AMOUNT_CENTS=${PAYOUT_MAX_BATCH_AMOUNT_CENTS:-0}
      - PAYOUT_RAIL=${PAYOUT_RAIL:-stub}
      - PAYOUT_AUTO_ENABLED=${PAYOUT_AUTO_ENABLED:-true}
      - PAYOUT_AUTO_APPROVE=${PAYOUT_AUTO_APPROVE:-true}
      - PAYOUT_AUTO_EXECUTE=${PAYOUT_AUTO_EXECUTE:-true}
      - PAYOUT_SEPA_XML_OUTPUT_DIR=${PAYOUT_SEPA_XML_OUTPUT_DIR:-/tmp/stillfresh-payouts}
      - CMIPLUS_STUB_MODE=${CMIPLUS_STUB_MODE:-true}
      - CMIPLUS_BASE_URL=${CMIPLUS_BASE_URL:-}
      - CMIPLUS_CLIENT_ID=${CMIPLUS_CLIENT_ID:-}
      - CMIPLUS_CLIENT_SECRET=${CMIPLUS_CLIENT_SECRET:-}
      # Payment provider selection: "stripe" (default) or "allsecure"
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-stripe}
      # AllSecure Exchange (sandbox). Put the secrets in your .env file - do not commit them.
      - ALLSECURE_BASE_URL=${ALLSECURE_BASE_URL:-https://asxgw.paymentsandbox.cloud}
      - ALLSECURE_API_KEY=${ALLSECURE_API_KEY:-genericmerchant-simulator-1}
      - ALLSECURE_SHARED_SECRET=${ALLSECURE_SHARED_SECRET:-}
      - ALLSECURE_USERNAME=${ALLSECURE_USERNAME:-genericmerchant-api-1}
      - ALLSECURE_PASSWORD=${ALLSECURE_PASSWORD:-}
      - ALLSECURE_INTEGRATION_KEY=${ALLSECURE_INTEGRATION_KEY:-sJBHPYLTFPNXjDYrQocG-1}
      - ALLSECURE_CURRENCY=${ALLSECURE_CURRENCY:-RSD}
      # Must be a public HTTPS URL tunneling to api-gateway :8080 (ngrok). See ALLSECURE_LOCAL_DEV.md
      - ALLSECURE_PUBLIC_BASE_URL=${ALLSECURE_PUBLIC_BASE_URL:-http://localhost:8080}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stillfresh_network

  # Notification Service
  notification-service:
    build: ./notification-service
    ports:
      - "8087:8087"
    depends_on:
      - eureka-server
      - notification-postgres
      - redis
      - kafka
    environment:
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - POSTGRES_PASSWORD_NOTIFICATION=${POSTGRES_PASSWORD_NOTIFICATION}
      - FIREBASE_CREDENTIALS_PATH=/app/firebase/firebase-service-account.json
      - NOTIFICATION_EMAIL_ENABLED=${NOTIFICATION_EMAIL_ENABLED:-false}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL:-}
      - MAILGUN_BASE_URL=${MAILGUN_BASE_URL:-https://api.mailgun.net/v3}
    volumes:
      - ${FIREBASE_CREDENTIALS_HOST_PATH}:/app/firebase/firebase-service-account.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - stillfresh_network

  admin-web:
    build:
      context: ./admin-web
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - stillfresh_network

  marketing-web:
    build:
      context: .
      dockerfile: marketing-web/Dockerfile
    ports:
      - "5174:80"
    networks:
      - stillfresh_network

volumes:
  vendor_uploads:
  user_postgres_data:
  vendor_postgres_data:
  auth_postgres_data:
  offer_postgres_data:
  order_postgres_data:
  payment_postgres_data:
  notification_postgres_data:
  kafka_data:

networks:
  stillfresh_network:
    driver: bridge
