server:
  port: 8081

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://user-postgres:5432/stillfresh_userdb
    driverClassName: org.postgresql.Driver
    username: stillfreshuser
    password: ${POSTGRES_PASSWORD_USER:}
  jpa:
    # ddl-auto and show-sql are profile-specific (see application-dev.yml / application-prod.yml)
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:kafka:9092}
    consumer:
      group-id: user-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.stillfresh.app.sharedentities,com.stillfresh.app.sharedentities.dto,com.stillfresh.app.sharedentities.enums,com.stillfresh.app.sharedentities.offer.events,com.stillfresh.app.sharedentities.order.events,com.stillfresh.app.sharedentities.payment.events,com.stillfresh.app.sharedentities.shared.events,com.stillfresh.app.sharedentities.user.events,com.stillfresh.app.sharedentities.vendor.events"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cache:
    type: redis

  data:
    redis:
      host: redis
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
      timeout: 60000

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka

# JWT and OAuth2 will now be handled by authorization-service
# Modify security accordingly to use the authorization-service
security:
  oauth2:
    resource:
      user-info-uri: http://authorization-service:8082/userinfo
      
mailgun:
  api-key: ${MAILGUN_API_KEY:}
  domain: ${MAILGUN_DOMAIN:}
  from-email: ${MAILGUN_FROM_EMAIL:}
  base-url: ${MAILGUN_BASE_URL:https://api.mailgun.net/v3}

jwt:
  # jwt.secret is profile-specific: prod requires it from the environment with no fallback.
  expiration: 3600000

# Public base URL used to build password-reset links in outbound email.
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

authorization:
  topic:
    password-update: password-update

order:
  topic:
    order-request: order-request
    fraud-flag: fraud-flag
    order-no-show: order-no-show

user:
  topic:
    user-suspended: user-suspended

strikes:
  suspension-threshold: 3

# gateway.internal.secret is profile-specific: prod requires it from the environment
# with no fallback so a missing value fails startup.
# internal.service.secret authenticates service-to-service calls that carry no end-user JWT.
# Profile-specific: prod requires it from the environment with no fallback.
