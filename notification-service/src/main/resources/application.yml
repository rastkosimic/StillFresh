server:
  port: 8087

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  application:
    name: notification-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:postgresql://notification-postgres:5432/stillfresh_notificationdb
    driverClassName: org.postgresql.Driver
    username: stillfreshnotification
    password: ${POSTGRES_PASSWORD_NOTIFICATION:}
  jpa:
    # ddl-auto, show-sql and format_sql are profile-specific
    # (see application-dev.yml / application-prod.yml)
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.stillfresh.app.sharedentities,com.stillfresh.app.sharedentities.dto,com.stillfresh.app.sharedentities.enums,com.stillfresh.app.sharedentities.offer.events,com.stillfresh.app.sharedentities.order.events,com.stillfresh.app.sharedentities.payment.events,com.stillfresh.app.sharedentities.shared.events,com.stillfresh.app.sharedentities.user.events,com.stillfresh.app.sharedentities.vendor.events"

  cache:
    type: redis

  data:
    redis:
      host: redis
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
      timeout: 60000

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka

security:
  oauth2:
    resource:
      user-info-uri: http://authorization-service:8082/userinfo

jwt:
  # jwt.secret is profile-specific: prod requires it from the environment with no fallback.
  expiration: 3600000

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:/app/firebase/firebase-service-account.json}
  project-id: stillfresh-app
  database-url: https://stillfresh-app.firebaseio.com

notification:
  # Transactional email (Mailgun). Disabled by default; push notifications are unaffected.
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    mailgun:
      api-key: ${MAILGUN_API_KEY:}
      domain: ${MAILGUN_DOMAIN:}
      from-email: ${MAILGUN_FROM_EMAIL:}
      base-url: ${MAILGUN_BASE_URL:https://api.mailgun.net/v3}
  topics:
    notification-request: notification-request
    notification-sent: notification-sent
    notification-failed: notification-failed
  # Delete notifications older than this many days (retention). Default 90.
  retention-days: 90
  # Cron for retention job (default: 3 AM daily). Example: "0 0 3 * * ?"
  retention-cron: "0 0 3 * * ?"

order:
  topic:
    order-placed: order-placed
    vendor-order-notification: vendor-order-notification

payment:
  topic:
    payment-success: payment-success
    payment-failure: payment-failure
    bank-transfer-initiated: bank-transfer-initiated
    bank-transfer-confirmed: bank-transfer-confirmed

offer:
  topic:
    offer-created: offer-created
    offer-updated: offer-updated

# gateway.internal.secret is profile-specific: prod requires it from the environment
# with no fallback so a missing value fails startup.

# internal.service.secret authenticates service-to-service calls that carry no end-user JWT.
# Profile-specific: prod requires it from the environment with no fallback.
