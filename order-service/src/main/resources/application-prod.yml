# Production profile.
# Secrets are intentionally declared without defaults: an unset variable fails placeholder
# resolution at startup rather than silently falling back to a known dev value.
spring:
  jpa:
    hibernate:
      # Flyway owns the schema (spring.flyway.enabled=true); `validate` fails fast on drift.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

gateway:
  internal:
    secret: ${GATEWAY_INTERNAL_SECRET}

logging:
  level:
    root: INFO
    '[com.stillfresh.app]': INFO
    '[org.hibernate.SQL]': WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

internal:
  service:
    secret: ${INTERNAL_SERVICE_SECRET}
