server:
  port: 8082

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: authorization-service
  datasource:
    url: jdbc:postgresql://auth-postgres:5432/stillfresh_authdb
    driverClassName: org.postgresql.Driver
    username: stillfreshauth
    password: ${POSTGRES_PASSWORD_AUTH:}
  jpa:
    hibernate:
      ddl-auto: update #update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:kafka:9092}
    consumer:
      group-id: authorization-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring:
        kafka:
          consumer:
            value:
              delegate:
                class: com.stillfresh.app.sharedentities.events.VendorRegisteredEvent
  cache:
    type: redis
  data:
    redis:
      host: redis
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
      timeout: 60000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            redirect-uri: http://localhost:8080/auth/oauth2/callback/google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: email

authorization:
  topic:
    password-update: password-update

mailgun:
  api-key: ${MAILGUN_API_KEY:}
  domain: ${MAILGUN_DOMAIN:}
  from-email: ${MAILGUN_FROM_EMAIL:}
  base-url: ${MAILGUN_BASE_URL:https://api.mailgun.net/v3}

jwt:
  secret: ${JWT_SECRET:}
  # Legacy (older clients used a single token). New clients should use accessJwt/refreshToken.
  expiration: 3600000
  access-expiration-ms: 900000        # 15 minutes
  refresh-expiration-ms: 2592000000   # 30 days

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
      vendor-service:
        connectTimeout: 2000
        readTimeout: 3000

gateway:
  internal:
    secret: ${GATEWAY_INTERNAL_SECRET:stillfresh-gw-dev-secret-change-in-prod}
