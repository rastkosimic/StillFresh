server:
  port: 8084

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  application:
    name: offer-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: jdbc:postgresql://offer-postgres:5432/stillfresh_offerdb
    driverClassName: org.postgresql.Driver
    username: stillfreshoffers
    password: ${POSTGRES_PASSWORD_OFFERS:}
  jpa:
    # ddl-auto and show-sql are profile-specific (see application-dev.yml / application-prod.yml)
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:kafka:9092}
    consumer:
      group-id: offer-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.stillfresh.app.sharedentities,com.stillfresh.app.sharedentities.dto,com.stillfresh.app.sharedentities.enums,com.stillfresh.app.sharedentities.offer.events,com.stillfresh.app.sharedentities.order.events,com.stillfresh.app.sharedentities.payment.events,com.stillfresh.app.sharedentities.shared.events,com.stillfresh.app.sharedentities.user.events,com.stillfresh.app.sharedentities.vendor.events"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cache:
    type: redis

  data:
    redis:
      host: redis
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
      timeout: 60000

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka

# gateway.internal.secret is profile-specific: prod requires it from the environment
# with no fallback so a missing value fails startup.


# internal.service.secret authenticates service-to-service calls that carry no end-user JWT.
# Profile-specific: prod requires it from the environment with no fallback.
