server:
  port: 8086

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://payment-postgres:5432/stillfresh_paymentdb
    driverClassName: org.postgresql.Driver
    username: stillfreshpayments
    password: ${POSTGRES_PASSWORD_PAYMENTS:}
  jpa:
    # ddl-auto and show-sql are profile-specific (see application-dev.yml / application-prod.yml)
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    listener:
      missing-topics-fatal: false

  cache:
    type: redis

  data:
    redis:
      host: redis
      port: 6379
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
      timeout: 60000

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka

# Runtime-customizable global platform fee. This value is only the seed/fallback used when the
# platform_settings.fee_percent row is missing; the live value is editable via PUT /admin/platform/fee.
platform:
  fee:
    percent: ${PLATFORM_FEE_PERCENT:10.0}

# Serbian e-fiskalni fiscal receipt issuance. Disabled by default; settlement is unaffected.
fiscal:
  enabled: ${FISCAL_ENABLED:false}
  endpoint-url: ${FISCAL_ENDPOINT_URL:}
  api-key: ${FISCAL_API_KEY:}

stripe:
  apiKey: ${STRIPE_API_KEY:}
  platform:
    fee:
      percent: 5.0 # Legacy key retained for backward compatibility; superseded by platform.fee.percent
  connect:
    # returnUrl/refreshUrl are profile-specific (public gateway URL differs per environment)
    defaultCountry: DE # Default country for Stripe Connect accounts (ISO 2-letter code: US, GB, DE, etc.)

# AllSecure Exchange Platform (XML Schema V2). Sandbox host differs from the production asxgw.com host.
# Credentials and endpoints are profile-specific: dev defaults to the public sandbox/simulator,
# prod requires every value from the environment with no fallback.
allsecure:
  transaction-path: ${ALLSECURE_TRANSACTION_PATH:/transaction}
  status-path: ${ALLSECURE_STATUS_PATH:/status}
  currency: ${ALLSECURE_CURRENCY:RSD}
  # Resilience against gateway rate limiting (HTTP 429 / code 1009): rate-limited requests are rejected
  # before processing, so retrying the same transactionId is safe. Backoff is exponential with jitter,
  # capped at retry-max-backoff-ms, and honours a Retry-After header when present.
  max-retries: ${ALLSECURE_MAX_RETRIES:4}
  retry-backoff-ms: ${ALLSECURE_RETRY_BACKOFF_MS:500}
  retry-max-backoff-ms: ${ALLSECURE_RETRY_MAX_BACKOFF_MS:4000}
  # Outbound HTTP timeouts for gateway calls (milliseconds).
  connect-timeout-ms: ${ALLSECURE_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${ALLSECURE_READ_TIMEOUT_MS:20000}
  
jwt:
  # jwt.secret is profile-specific: prod requires it from the environment with no fallback.
  expiration: 3600000

payment:
  # Active payment provider: "stripe" (default, unchanged behaviour) or "allsecure"
  provider: ${PAYMENT_PROVIDER:stripe}
  topic:
    payment-request: payment-request
    payment-success: payment-success-topic
    payment-failure: payment-failure-topic
    mor-payout-data-request: mor-payout-data-request
    mor-payout-data-response: mor-payout-data-response
    mor-payout-status-update-request: mor-payout-status-update-request
    mor-payout-status-update-response: mor-payout-status-update-response
    vendor-payment-info-request: vendor-payment-info-request
    vendor-payment-info-response: vendor-payment-info-response
    order-payment-settled: order-payment-settled
    payment-captured: payment-captured-topic
    bank-transfer-order: bank-transfer-order
    bank-transfer-initiated: bank-transfer-initiated
    bank-transfer-confirmed: bank-transfer-confirmed
    payment-cancel-request: payment-cancel-request
    payment-capture-request: payment-capture-request

bank-transfer:
  platform:
    iban: ${PLATFORM_IBAN}
    bank-name: ${PLATFORM_BANK_NAME}
    account-holder: ${PLATFORM_ACCOUNT_HOLDER}
  payment-expiry-hours: ${BANK_TRANSFER_EXPIRY_HOURS:24}

payout:
  schedule:
    # Cron: daily at 02:00 UTC. Override via PAYOUT_SCHEDULE_CRON env var.
    cron: ${PAYOUT_SCHEDULE_CRON:0 0 2 * * *}
  default-currency: ${PAYOUT_DEFAULT_CURRENCY:RSD}
  # Maximum total batch amount in minor currency units (0 = no limit).
  max-batch-amount-cents: ${PAYOUT_MAX_BATCH_AMOUNT_CENTS:0}
  # payout.rail and payout.auto.* are profile-specific. The `stub` rail only logs transfers
  # while marking them complete, so it must never be the effective value in production.
  status-poll:
    cron: ${PAYOUT_STATUS_POLL_CRON:0 */15 * * * *}
  executor:
    # Legacy sync executors (used when payout.rail=stub or sepa-xml)
    sepa-xml:
      output-dir: ${PAYOUT_SEPA_XML_OUTPUT_DIR:/tmp/stillfresh-payouts}
    stub:
      fail: ${PAYOUT_EXECUTOR_STUB_FAIL:false}
  cmiplus:
    # environment and stub-mode are profile-specific.
    base-url: ${CMIPLUS_BASE_URL:}
    client-id: ${CMIPLUS_CLIENT_ID:}
    client-secret: ${CMIPLUS_CLIENT_SECRET:}
    keystore-path: ${CMIPLUS_KEYSTORE_PATH:}
    keystore-password: ${CMIPLUS_KEYSTORE_PASSWORD:}
    debtor-iban: ${PLATFORM_IBAN:}
    debtor-name: ${PLATFORM_ACCOUNT_HOLDER:}
    token-path: ${CMIPLUS_TOKEN_PATH:/oauth/token}
    payment-initiation-path: ${CMIPLUS_PAYMENT_INITIATION_PATH:/payment-initiation}
    payment-status-path: ${CMIPLUS_PAYMENT_STATUS_PATH:/payment-status}
    account-statement-path: ${CMIPLUS_ACCOUNT_STATEMENT_PATH:/account-statement}
    stub-complete-delay-seconds: ${CMIPLUS_STUB_COMPLETE_DELAY_SECONDS:30}

# gateway.internal.secret is profile-specific: prod requires it from the environment
# with no fallback so a missing value fails startup.

# internal.service.secret authenticates service-to-service calls that carry no end-user JWT.
# Profile-specific: prod requires it from the environment with no fallback.